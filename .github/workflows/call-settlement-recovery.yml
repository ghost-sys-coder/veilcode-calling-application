name: Call settlement recovery
on:
  push:
    branches: [master]
    paths: ['.github/workflows/call-settlement-recovery.yml']
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: call-settlement-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      id-token: write
    steps:
      # No checkout or third-party action receives this identity. This workflow
      # cannot send reminder emails and has its own audience and pinned claims.
      - name: Recover unfinished call settlements
        run: |
          node --input-type=module <<'NODE'
          const audience = 'https://call.veilcode.studio/call-settlement-recovery';
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set('audience', audience);
          const identity = await fetch(tokenUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            signal: AbortSignal.timeout(15000),
          });
          if (!identity.ok) throw new Error('GitHub identity could not be obtained.');
          const { value } = await identity.json();
          if (!value) throw new Error('GitHub identity was missing.');
          console.log(`::add-mask::${value}`);
          const response = await fetch('https://call.veilcode.studio/api/internal/call-settlements', {
            headers: { 'X-VeilCall-Scheduler-Token': value },
            redirect: 'error', signal: AbortSignal.timeout(65000),
          });
          if (!response.ok) throw new Error(`Settlement recovery failed (HTTP ${response.status}).`);
          const result = await response.json();
          console.log(JSON.stringify({ processed: result.processed, settled: result.settled, pending: result.pending,
            due: result.status.due, review: result.status.review }));
          if (result.status.review) console.log(`::warning::${result.status.review} call settlements need owner review in Billing.`);
          NODE
