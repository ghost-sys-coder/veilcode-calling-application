name: Callback email reminders

on:
  push:
    branches: [master]
    paths: ['.github/workflows/callback-email-reminders.yml']
  schedule:
    # Avoid the busiest minute at the top of the hour. GitHub may delay runs.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: callback-email-reminders
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      id-token: write
    steps:
      # No checkout or third-party action runs with the identity token.
      # The app pins the signed repo, owner, branch and workflow claims.
      - name: Process due callback emails
        env:
          DISPATCH_URL: https://call.veilcode.studio/api/voice/reminders/email/dispatch
          DISPATCH_AUDIENCE: https://call.veilcode.studio/callback-email-dispatch
        run: |
          node --input-type=module <<'NODE'
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set('audience', process.env.DISPATCH_AUDIENCE);
          const identity = await fetch(tokenUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            signal: AbortSignal.timeout(15000),
          });
          if (!identity.ok) throw new Error('GitHub identity could not be obtained.');
          const { value } = await identity.json();
          if (!value) throw new Error('GitHub identity was missing.');
          console.log(`::add-mask::${value}`);
          const response = await fetch(process.env.DISPATCH_URL, {
            headers: { 'X-VeilCall-Scheduler-Token': value },
            redirect: 'error',
            signal: AbortSignal.timeout(65000),
          });
          if (!response.ok) {
            console.log(JSON.stringify({ status: response.status, contentType: response.headers.get('content-type'), clerkReason: response.headers.get('x-clerk-auth-reason') }));
            throw new Error(`Callback email dispatch failed (HTTP ${response.status}).`);
          }
          const result = await response.json();
          console.log(JSON.stringify({ accepted: result.accepted, retry: result.retry, failed: result.failed, skipped: result.skipped }));
          if (result.failed > 0) throw new Error('One or more callback emails need attention.');
          NODE

      - name: Recover unfinished call settlements
        if: ${{ !cancelled() }}
        # Own audience; this step never sends emails. Reuse the scheduled runner
        # and still recover held credit when the email step fails.
        run: |
          node --input-type=module <<'NODE'
          const audience = 'https://call.veilcode.studio/call-settlement-recovery';
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set('audience', audience);
          const identity = await fetch(tokenUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            signal: AbortSignal.timeout(15000),
          });
          if (!identity.ok) throw new Error('GitHub identity could not be obtained.');
          const { value } = await identity.json();
          if (!value) throw new Error('GitHub identity was missing.');
          console.log(`::add-mask::${value}`);
          const response = await fetch('https://call.veilcode.studio/api/internal/call-settlements', {
            headers: { 'X-VeilCall-Scheduler-Token': value },
            redirect: 'error', signal: AbortSignal.timeout(65000),
          });
          if (!response.ok) throw new Error(`Settlement recovery failed (HTTP ${response.status}).`);
          const result = await response.json();
          console.log(JSON.stringify({ processed: result.processed, settled: result.settled, pending: result.pending,
            due: result.status.due, review: result.status.review }));
          if (result.status.review) console.log(`::warning::${result.status.review} call settlements need owner review in Billing.`);
          NODE
